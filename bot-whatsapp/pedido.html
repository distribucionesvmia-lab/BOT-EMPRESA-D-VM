<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacer pedido</title>
<style>
  :root { --verde:#1a9c5b; --verde-oscuro:#127a46; --fondo:#f4f5f4; --texto:#1c2420; --gris:#7a857f; --linea:#e7eae8; --chip:#fde3e3; --chip-t:#c43b3b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fondo); color:var(--texto); display:flex; justify-content:center; }
  .app { width:100%; max-width:520px; height:100%; background:#fff; display:flex; flex-direction:column; position:relative; }
  header { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--linea); }
  .logo { width:38px; height:38px; border-radius:10px; background:var(--verde); color:#fff; display:grid; place-items:center; font-weight:700; flex:none; }
  .ttl { flex:1; min-width:0; }
  .ttl b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttl small { color:var(--gris); font-size:13px; }
  .cartbtn { border:0; background:none; font-size:15px; font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer; color:var(--texto); }
  nav { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; border-bottom:1px solid var(--linea); align-items:center; }
  nav button.tab { border:0; background:var(--fondo); padding:9px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--gris); cursor:pointer; white-space:nowrap; }
  nav button.tab.on { background:#e5f5ec; color:var(--verde-oscuro); }
  nav input { flex:1 1 140px; min-width:0; border:1px solid var(--linea); border-radius:10px; padding:9px 12px; font-size:14px; outline:none; }
  .filbar { display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--linea); }
  .filbar[hidden] { display:none; }
  .filbar .fil { border:1px solid var(--linea); background:#fff; padding:8px 12px; border-radius:10px; font:inherit; font-size:14px; font-weight:600; color:var(--gris); cursor:pointer; }
  .filbar .fil[aria-pressed="true"] { background:var(--verde-oscuro); border-color:var(--verde-oscuro); color:#fff; }
  .filbar span { color:var(--gris); font-size:13px; }
  main { flex:1; overflow-y:auto; padding-bottom:84px; }
  .p { display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--linea); align-items:center; }
  .av { width:52px; height:52px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff; font-weight:700; font-size:16px; }
  .info { flex:1; min-width:0; }
  .info .n { font-weight:600; font-size:15px; line-height:1.25; }
  .info .c { color:var(--gris); font-size:12px; margin-top:2px; }
  .info .pr { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .pr b { font-size:16px; }
  .chip { background:var(--chip); color:var(--chip-t); border:0; border-radius:6px; font-size:11.5px; font-weight:700; padding:3px 7px; cursor:pointer; }
  .ctl { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .add { width:42px; height:36px; border:0; border-radius:10px; background:var(--verde); color:#fff; font-size:22px; line-height:1; cursor:pointer; }
  .step { display:flex; align-items:center; border:1px solid var(--linea); border-radius:10px; overflow:hidden; }
  .step button { width:34px; height:36px; border:0; background:#fff; font-size:20px; color:var(--verde-oscuro); cursor:pointer; }
  .step input { width:44px; height:36px; border:0; border-left:1px solid var(--linea); border-right:1px solid var(--linea); text-align:center; font-size:15px; font-weight:700; outline:none; -moz-appearance:textfield; }
  .step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .ud { display:flex; border:1px solid var(--linea); border-radius:8px; overflow:hidden; font-size:12px; }
  .ud button { border:0; background:#fff; padding:4px 8px; cursor:pointer; color:var(--gris); font-weight:600; }
  .ud button.on { background:#e5f5ec; color:var(--verde-oscuro); }
  .lnote { width:calc(100% - 28px); margin:0 14px 10px; border:1px solid var(--linea); border-radius:8px; padding:8px 10px; font:inherit; font-size:13px; }
  .vacio { padding:40px 20px; text-align:center; color:var(--gris); }
  footer { position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, #fff 30%); }
  .big { width:100%; border:0; border-radius:12px; background:var(--verde); color:#fff; font-size:16px; font-weight:700; padding:15px; cursor:pointer; }
  .big:disabled { background:#b9c4be; cursor:default; }
  .big.sec { background:#fff; color:var(--verde-oscuro); border:1px solid var(--verde); margin-top:8px; }
  .opt { width:100%; text-align:left; border:2px solid var(--linea); border-radius:14px; background:#fff; padding:14px 16px; font:inherit; font-size:17px; font-weight:700; color:var(--texto); cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .opt small { font-size:13px; font-weight:400; color:var(--gris); }
  .opt:hover, .opt:focus-visible { border-color:var(--verde); outline:none; background:#f3fbf7; }
  .opt:disabled { opacity:.5; cursor:default; }
  .cal-fondo { position:absolute; inset:0; z-index:8; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; }
  .cal-fondo[hidden] { display:none; }
  .cal { background:#fff; border-radius:16px; padding:14px; width:100%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .cal-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-h b { text-transform:capitalize; font-size:16px; }
  .cal-h button { border:0; background:var(--fondo); width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; }
  .cal-h button:disabled { opacity:.35; cursor:default; }
  .cal-g { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-g span { font-size:12px; color:var(--gris); padding:4px 0; }
  .cal-g button { border:0; background:none; height:38px; border-radius:10px; font:inherit; font-size:15px; cursor:pointer; color:var(--texto); }
  .cal-g button:hover:not(:disabled) { background:#e5f5ec; }
  .cal-g button:disabled { color:#c3c9c6; cursor:default; }
  .cal-g button.hoy { font-weight:700; box-shadow:inset 0 0 0 1.5px var(--verde); }
  .cal-g button.sel { background:var(--verde); color:#fff; font-weight:700; }
  .cal-pie { margin-top:10px; display:grid; gap:8px; }
  .cal-pie p { margin:0; font-size:14px; color:var(--gris); min-height:20px; text-align:center; }
  .screen { position:absolute; inset:0; background:#fff; display:flex; flex-direction:column; z-index:5; }
  .screen[hidden] { display:none; }
  .screen h2 { margin:0; font-size:17px; }
  .screen .head { padding:14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--linea); }
  .screen .head button { border:0; background:none; font-size:22px; cursor:pointer; }
  .screen .body { flex:1; overflow-y:auto; }
  .tot { display:flex; justify-content:space-between; padding:14px; font-size:17px; border-top:1px solid var(--linea); }
  .box { padding:14px; }
  .box textarea { width:100%; border:1px solid var(--linea); border-radius:10px; padding:10px; font:inherit; font-size:14px; resize:none; min-height:60px; }
  .nota { color:var(--gris); font-size:12px; padding:0 14px 10px; }
  .ok { text-align:center; padding:50px 24px; }
  .ok .tick { width:72px; height:72px; border-radius:50%; background:var(--verde); color:#fff; font-size:38px; display:grid; place-items:center; margin:0 auto 16px; }
  .err { color:#c43b3b; padding:0 14px 8px; font-size:14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo">·</div>
    <div class="ttl"><b id="ttl">Cargando…</b><small id="sub"></small></div>
    <button class="cartbtn" id="cartIcon" type="button">🛒 <span id="cnt">0</span></button>
  </header>
  <nav>
    <button class="tab on" data-t="hab" type="button">★ Histórico no habitual</button>
    <button class="tab" data-t="all" type="button">☰ Catálogo</button>
    <input id="q" type="search" placeholder="Buscar" autocomplete="off">
  </nav>
  <!-- Filtro de ida y vuelta, solo en la pestaña «Histórico no habitual» (data-t="hab") -->
  <div class="filbar" id="filbar" hidden><button class="fil" id="fil" type="button" aria-pressed="false">☑ Solo con cantidad</button><span id="filinfo"></span></div>
  <main id="list"></main>
  <footer><button class="big" id="verCarrito" type="button" disabled>Ver carrito (0)</button></footer>

  <section class="screen" id="cart" hidden>
    <div class="head"><button id="back" type="button">←</button><h2>Tu pedido</h2></div>
    <div class="body">
      <div id="cartLines"></div>
      <div class="box"><div id="addr" style="font-size:14px;color:var(--gris)"></div></div>
      <div class="box" style="padding-top:0"><label for="note" style="display:block;font-weight:600;font-size:14px;margin-bottom:6px">Observaciones del cliente</label><textarea id="note" placeholder="Ej.: avísame por teléfono antes de entregar (opcional)" maxlength="200"></textarea></div>
      <div class="nota" id="priceNote"></div>
      <div class="err" id="err"></div>
    </div>
    <div class="tot"><span>Total aprox.</span><b id="total">0,00 €</b></div>
    <div class="box"><button class="big" id="confirm" type="button">Finalizar pedido</button><button class="big sec" id="keep" type="button">Seguir añadiendo</button></div>
  </section>

  <!-- Al finalizar: ¿cuándo quieres recibirlo? -->
  <section class="screen" id="when" hidden style="z-index:6">
    <div class="head"><button id="backWhen" type="button" aria-label="Volver al carrito">←</button><h2>¿Cuándo quieres recibirlo?</h2></div>
    <div class="body" style="padding:14px">
      <p style="margin:0 0 12px;color:var(--gris)">Elige el día de entrega. Al pulsarlo, tu pedido se envía.</p>
      <div id="whenOpts" style="display:grid;gap:10px"></div>
      <div class="err" id="errWhen" role="alert"></div>
    </div>
    <div class="cal-fondo" id="calFondo" hidden>
      <div class="cal" role="dialog" aria-modal="true" aria-label="Elegir otro día de entrega">
        <div class="cal-h"><button id="calAnt" type="button" aria-label="Mes anterior">‹</button><b id="calMes"></b><button id="calSig" type="button" aria-label="Mes siguiente">›</button></div>
        <div class="cal-g" id="calGrid"></div>
        <div class="cal-pie"><p id="calSel">Toca el día que quieras</p><button class="big" id="calOk" type="button" disabled>Elegir este día</button><button class="big sec" id="calCerrar" type="button" style="margin-top:0">Cancelar</button></div>
      </div>
    </div>
  </section>

  <section class="screen" id="done" hidden>
    <div class="ok"><div class="tick">✓</div><h2 id="doneT">¡Pedido recibido!</h2><p id="doneP" style="color:var(--gris)"></p><p id="backlink" hidden><a href="/cliente">Volver al chat</a></p></div>
  </section>
</div>

<script>
const token = location.pathname.split("/")[2];
const $ = id => document.getElementById(id);
const COLORS = ["#2f8f6b", "#c0763a", "#5b7bd5", "#a1507c", "#8a8f2b", "#3c8fa6", "#b8523f", "#6c5ba8"];
const eur = n => n.toFixed(2).replace(".", ",") + " €";
let data = null, tab = "hab", query = "";
// Clave de este pedido: si se reenvía (doble clic, fallo de red), el servidor no lo duplica
const orderKey = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
const qty = new Map(); // id -> cantidad (en cajas o en unidades, según unitOf)
const unitOf = new Map(); // id -> "ud" | "caja"
const notes = new Map(); // id -> observación de la línea
const unit = id => unitOf.get(id) || "ud";
const uds = l => l.qty * (unit(l.id) === "caja" ? (l.unitsPerBox || 1) : 1);

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const hue = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = n => n.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const lines = () => data.products.filter(p => qty.get(p.id) > 0).map(p => ({ ...p, qty: qty.get(p.id) }));
const count = () => lines().length;
const total = () => lines().reduce((t, l) => t + uds(l) * l.price, 0);

function setQty(id, n) {
  n = Math.max(0, Math.min(999, Math.floor(Number(n) || 0)));
  if (n) qty.set(id, n); else { qty.delete(id); unitOf.delete(id); notes.delete(id); }
  refresh();
}

function control(p) {
  const q = qty.get(p.id) || 0, box = document.createElement("div");
  box.className = "ctl";
  // Artículos que se venden en cajas: el cliente elige Uds o Cajas desde el principio, antes de añadirlos
  if (p.unitsPerBox) {
    const sel = document.createElement("div"); sel.className = "ud"; sel.setAttribute("role", "group"); sel.setAttribute("aria-label", "Pedir en");
    for (const [u, t] of [["ud", "Uds"], ["caja", "Cajas"]]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.className = unit(p.id) === u ? "on" : "";
      b.onclick = () => { unitOf.set(p.id, u); refresh(); };
      sel.appendChild(b);
    }
    box.appendChild(sel);
  }
  if (!q) {
    const b = document.createElement("button");
    b.className = "add"; b.type = "button"; b.textContent = "+"; b.setAttribute("aria-label", "Añadir " + p.name);
    b.onclick = () => setQty(p.id, 1);
    box.appendChild(b);
    return box;
  }
  const st = document.createElement("div"); st.className = "step";
  const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.onclick = () => setQty(p.id, q - 1);
  const inp = document.createElement("input"); inp.type = "number"; inp.inputMode = "numeric"; inp.min = 0; inp.value = q;
  inp.onchange = () => setQty(p.id, inp.value);
  const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.onclick = () => setQty(p.id, q + 1);
  st.append(minus, inp, plus); box.appendChild(st);
  return box;
}

function row(p) {
  const el = document.createElement("div"); el.className = "p";
  const av = document.createElement("div"); av.className = "av"; av.style.background = hue(p.name); av.textContent = initials(p.name);
  const info = document.createElement("div"); info.className = "info";
  const n = document.createElement("div"); n.className = "n"; n.textContent = p.name;
  const c = document.createElement("div"); c.className = "c"; c.textContent = "Cód. " + p.id;
  const pr = document.createElement("div"); pr.className = "pr";
  const price = document.createElement("b"); price.textContent = eur(p.price); pr.appendChild(price);
  if (p.lastQty) {
    const chip = document.createElement("button"); chip.type = "button"; chip.className = "chip";
    chip.textContent = "Última vez: " + p.lastQty + " uds"; chip.title = "Pedir las mismas unidades";
    chip.onclick = () => { unitOf.set(p.id, "ud"); setQty(p.id, p.lastQty); }; // las de la última vez son unidades
    pr.appendChild(chip);
  }
  if (p.unitsPerBox) c.textContent += " · caja de " + p.unitsPerBox + " uds" + (unit(p.id) === "caja" && qty.get(p.id) ? " → " + qty.get(p.id) * p.unitsPerBox + " uds" : "");
  info.append(n, c, pr);
  el.append(av, info, control(p));
  return el;
}

let soloCantidad = false; // filtro de la pestaña de habituales: ocultar los artículos sin cantidad marcada
function renderList() {
  const list = $("list"); list.innerHTML = "";
  $("filbar").hidden = tab !== "hab"; // el filtro solo existe en esta pestaña
  const q = norm(query.trim());
  const filtra = tab === "hab" && soloCantidad;
  let items = data.products.filter(p => (tab === "all" || p.count > 0 || q) && (!q || norm(p.name).includes(q) || p.id.includes(q)) && (!filtra || qty.get(p.id) > 0));
  $("fil").setAttribute("aria-pressed", String(soloCantidad));
  $("filinfo").textContent = filtra ? `Mostrando ${items.length} con cantidad` : "";
  if (!items.length) {
    const d = document.createElement("div"); d.className = "vacio";
    d.textContent = filtra ? "Aún no has marcado ninguna cantidad. Pulsa «Solo con cantidad» para volver a ver todos." : tab === "hab" && !q ? "Aún no tienes histórico. Mira el catálogo." : "No hay resultados.";
    list.appendChild(d); return;
  }
  items.slice(0, 150).forEach(p => list.appendChild(row(p)));
}

function renderCart() {
  const box = $("cartLines"); box.innerHTML = "";
  lines().forEach(l => {
    box.appendChild(row(l));
    const ta = document.createElement("input"); ta.className = "lnote"; ta.maxLength = 120;
    ta.placeholder = "Observación para este artículo (opcional)"; ta.value = notes.get(l.id) || "";
    ta.oninput = () => notes.set(l.id, ta.value);
    box.appendChild(ta);
  });
  $("total").textContent = eur(total());
  if (!count()) showCart(false);
}

function refresh() {
  const n = count();
  $("cnt").textContent = n;
  $("verCarrito").textContent = n ? `Ver carrito (${n}) · ${eur(total())}` : "Ver carrito (0)";
  $("verCarrito").disabled = !n;
  const scroll = $("list").scrollTop;
  renderList(); $("list").scrollTop = scroll;
  if (!$("cart").hidden) renderCart();
}
function showCart(on) { $("cart").hidden = !on; if (on) { $("err").textContent = ""; renderCart(); } }

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
$("fil").onclick = () => { soloCantidad = !soloCantidad; renderList(); }; // ida y vuelta
$("q").oninput = e => { query = e.target.value; renderList(); };
$("verCarrito").onclick = $("cartIcon").onclick = () => count() && showCart(true);
$("back").onclick = $("keep").onclick = () => showCart(false);

// Finalizar: primero se pregunta el día de entrega y, al elegirlo, se envía el pedido
$("confirm").onclick = () => {
  if (!(data.delivery || []).length) return enviarPedido(null, $("err"));
  $("errWhen").textContent = ""; pintarOpciones(); $("when").hidden = false;
};
function pintarOpciones() {
  const box = $("whenOpts"); box.innerHTML = "";
  for (const o of data.delivery) {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt";
    b.append(o.label); if (o.detail) { const d = document.createElement("small"); d.textContent = o.detail; b.appendChild(d); }
    b.onclick = () => enviarPedido(o.date, $("errWhen"));
    box.appendChild(b);
  }
  const otro = document.createElement("button"); otro.type = "button"; otro.className = "opt"; otro.id = "otroDia";
  otro.append("📅 Otro día"); const sm = document.createElement("small"); sm.textContent = "Abre un calendario para elegir cualquier fecha"; otro.appendChild(sm);
  otro.onclick = abrirCal; box.appendChild(otro);
}
// «Otro día»: calendario pequeño para marcar cualquier día desde hoy hasta dentro de 90 días
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const addDaysIso = (day, n) => new Date(Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10) + n)).toISOString().slice(0, 10);
const largo = day => { const d = new Date(Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10))); return `${DIAS[d.getUTCDay()]} ${+day.slice(8, 10)} de ${MESES[+day.slice(5, 7) - 1]}`; };
let cal = { y: 0, m: 0, sel: null };
function pintarCal() {
  const hoy = data.minDate, max = addDaysIso(data.today, 90); // el calendario empieza en el mismo día que el primer botón: no puede contradecirlo
  $("calMes").textContent = `${MESES[cal.m]} ${cal.y}`;
  const g = $("calGrid"); g.innerHTML = "";
  for (const d of ["L", "M", "X", "J", "V", "S", "D"]) { const e = document.createElement("span"); e.textContent = d; g.appendChild(e); }
  const first = new Date(Date.UTC(cal.y, cal.m, 1)).getUTCDay(), dias = new Date(Date.UTC(cal.y, cal.m + 1, 0)).getUTCDate();
  for (let i = 0; i < (first + 6) % 7; i++) g.appendChild(document.createElement("i")); // la semana empieza en lunes
  for (let d = 1; d <= dias; d++) {
    const day = iso(cal.y, cal.m, d), b = document.createElement("button");
    b.type = "button"; b.textContent = d; b.disabled = day < hoy || day > max;
    if (day === data.today) b.className = "hoy"; if (day === cal.sel) b.classList.add("sel");
    b.setAttribute("aria-label", largo(day));
    b.onclick = () => { cal.sel = day; $("calSel").textContent = largo(day); $("calOk").disabled = false; pintarCal(); };
    g.appendChild(b);
  }
  $("calAnt").disabled = iso(cal.y, cal.m, 1) <= data.today.slice(0, 8) + "01";
  $("calSig").disabled = iso(cal.y, cal.m + 1 > 11 ? cal.y + 1 : cal.y, cal.m + 1 > 11 ? 0 : cal.m + 1) > max.slice(0, 8) + "01";
}
function abrirCal() {
  const [y, m] = data.today.split("-").map(Number);
  cal = { y, m: m - 1, sel: null }; $("calSel").textContent = "Toca el día que quieras"; $("calOk").disabled = true;
  $("calFondo").hidden = false; pintarCal();
}
$("calAnt").onclick = () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } pintarCal(); };
$("calSig").onclick = () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } pintarCal(); };
$("calCerrar").onclick = () => ($("calFondo").hidden = true);
$("calOk").onclick = () => { if (cal.sel) { $("calFondo").hidden = true; enviarPedido(cal.sel, $("errWhen")); } };
$("backWhen").onclick = () => ($("when").hidden = true);
async function enviarPedido(delivery, errBox) {
  const opts = [...document.querySelectorAll("#whenOpts .opt")], btn = $("confirm");
  opts.forEach(o => (o.disabled = true)); btn.disabled = true; errBox.textContent = "";
  try {
    const r = await fetch(location.pathname, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: orderKey, lines: lines().map(l => ({ id: l.id, qty: l.qty, unit: unit(l.id), note: (notes.get(l.id) || "").trim() })), note: $("note").value, delivery }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "No se ha podido enviar el pedido");
    $("doneP").textContent = j.message; $("when").hidden = true; $("done").hidden = false; $("backlink").hidden = parent !== window;
    if (parent !== window) parent.postMessage({ tipo: "pedido", mensaje: j.message }, "*");
  } catch (e) {
    errBox.textContent = e.message; opts.forEach(o => (o.disabled = false)); btn.disabled = false;
    if (/10:00/.test(e.message)) { // pasó la hora de corte mientras elegía: se actualizan las opciones
      const r2 = await fetch(location.pathname + "/datos").catch(() => null);
      if (r2 && r2.ok) { const d2 = await r2.json(); data.delivery = d2.delivery; data.today = d2.today; data.minDate = d2.minDate; pintarOpciones(); errBox.textContent = e.message; }
    }
  }
}

(async () => {
  const r = await fetch(location.pathname + "/datos");
  if (!r.ok) { $("ttl").textContent = "Sesión caducada"; $("sub").innerHTML = "Vuelve a <a href=\"/cliente\">entrar con tu teléfono y PIN</a>."; $("list").innerHTML = ""; $("verCarrito").hidden = true; return; }
  data = await r.json();
  document.title = "Pedido a " + data.business;
  $("ttl").textContent = "Pedido a " + data.business;
  $("sub").textContent = data.customer.name;
  $("logo").textContent = initials(data.business);
  $("addr").textContent = "📍 Entrega en: " + (data.customer.address || "—");
  $("priceNote").textContent = data.priceNote || "";
  if (data.used) { $("doneT").textContent = "Este pedido ya se envió"; $("doneP").textContent = "Vuelve al chat para hacer otro pedido."; $("done").hidden = false; return; }
  if (!data.products.some(p => p.count > 0)) { tab = "all"; document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === "all")); }
  refresh();
})();
</script>
</body>

# Dos aplicaciones con las MISMAS bases de datos:
#   cliente  lo que se entrega a los clientes: es la ÚNICA que se publica en internet.
#   empresa  lo del empresario: solo escucha en el propio servidor (127.0.0.1); no se publica.
# Los datos viven en el volumen «datos» y sobreviven a reinicios y actualizaciones.
# Uso:  cp .env.example .env  (rellenar)  ·  docker compose up -d --build
# Ver la aplicación de la empresa SIN abrirla a internet: ver docs/DESPLIEGUE.md (túnel SSH, Tailscale o red de la oficina).
x-datos: &datos
  DB_PATH: /data/pedidos.sqlite
  CATALOG_DB: /data/catalogo.sqlite
  CUSTOMERS_DB: /data/clientes.sqlite
  ACCOUNTS_DB: /data/cuentas.sqlite
  EXPORT_DIR: /data/exportaciones
  BACKUP_DIR: /data/respaldos
  NIF_PEPPER: ${NIF_PEPPER} # huellas del NIF de los clientes (igual en las dos aplicaciones)

services:
  cliente:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000" # detrás de un proxy con HTTPS (ver deploy/Caddyfile)
    environment:
      <<: *datos
      APP_MODE: cliente
      PUBLIC_URL: ${PUBLIC_URL} # https://pedidos.tuempresa.es
      TRUST_PROXY: "1"
      # Esta aplicación NO recibe la clave de la empresa
    volumes:
      - datos:/data

  empresa:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # solo accesible desde el propio servidor
    environment:
      <<: *datos
      APP_MODE: empresa
      ADMIN_TOKEN: ${ADMIN_TOKEN} # clave de la empresa: larga y secreta
      # Sincronización automática de clientes y productos con una carpeta de Google Drive (ver docs/GOOGLE_DRIVE.md); solo esta aplicación
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      SYNC_MINUTES: ${SYNC_MINUTES:-15}
      PUBLIC_URL: http://localhost:3001
    volumes:
      - datos:/data

volumes:
  datos:

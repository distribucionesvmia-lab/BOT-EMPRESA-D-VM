# Despliegue en Render (Blueprint): el fichero tiene que estar en la RAÍZ del repositorio.
# Disco persistente en /var/data: ahí viven TODAS las bases de datos (pedidos, cuentas, clientes, catálogo), las exportaciones y las copias
# de seguridad diarias, y sobreviven a reinicios y redespliegues. Render además guarda copias diarias del disco (restaurables 7 días).
# ⚠️ Usa el plan «starter» (de pago): el plan gratuito se suspende y no admite disco persistente.
services:
  - type: web
    name: bot-pedidos-vm
    runtime: node
    rootDir: bot-whatsapp
    plan: starter
    buildCommand: "echo sin dependencias"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LINK_SECRET
        generateValue: true
      - key: PUBLIC_URL        # pon aquí la dirección https que te asigne Render
        sync: false
      - key: DB_PATH
        value: /var/data/pedidos.sqlite
      - key: EXPORT_DIR
        value: /var/data/exportaciones
      - key: CATALOG_DB
        value: /var/data/catalogo.sqlite
      - key: CUSTOMERS_DB
        value: /var/data/clientes.sqlite
      - key: ACCOUNTS_DB
        value: /var/data/cuentas.sqlite
      - key: ADMIN_TOKEN       # tu clave de administrador: Render la genera; cópiala desde Environment
        generateValue: true
      - key: NIF_PEPPER        # secreto de las huellas del NIF: Render lo genera UNA vez; guarda una copia y no lo cambies
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Sincronización automática con la carpeta «datos» de Google Drive (docs/GOOGLE_DRIVE.md). Solo funciona sin DEMO.
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Aviso por correo de cada pedido (IONOS: smtp.ionos.es, puerto 587)
      - key: SMTP_HOST
        value: smtp.ionos.es
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: SYNC_MINUTES
        value: "15"
      - key: BACKUP_DIR
        value: /var/data/respaldos
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
